<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromoNexus | Terminal de Réductions</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="scanline"></div>
    
    <header>
        <h1>PROMO-NEXUS</h1>
        <p class="glitch-base">SYSTÈME DE DÉCRYPTAGE DE CODES PROMO v2.0</p>
    </header>

    <div class="container">
        <!-- BOUTONS DE CATÉGORIE -->
        <div class="filter-tabs">
            <button class="tab-btn active" onclick="setCategory('ALL')">TOUT</button>
            <button class="tab-btn" onclick="setCategory('PROMO')">CODES PROMO</button>
            <button class="tab-btn" onclick="setCategory('CARD')">CARTES PRÉPAYÉES</button>
        </div>

        <!-- BARRE DE RECHERCHE -->
        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="Scanner un domaine (ex: Amazon, Nike, Steam...)" autocomplete="off">
            <div class="search-glow"></div>
        </div>

        <!-- RÉSULTATS -->
        <div id="results" class="results-grid"></div>
    </div>

    <footer>
        <p>STATUS: SYSTÈME EN LIGNE // BASES DE DONNÉES MISES À JOUR</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
